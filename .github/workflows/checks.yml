name: Game checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm run install:ci
      - run: node --test tests/*.test.mjs
      - run: npx tsc --noEmit
      - run: npm run build
